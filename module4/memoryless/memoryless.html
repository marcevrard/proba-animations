    return (m[0] === null || m[0] === state.rep) && (m[1] === null || m[1] === state.view);
  });
  Plotly.restyle(gd, {visible: vis}, META.map(function (m, i) { return i; }));
  Plotly.relayout(gd, titles());
  formulas.innerHTML = LAWS[state.dist].forms[state.rep];
  yTop = [null, null];
}
toggle(footer.querySelectorAll(".anim-rep button"), state.rep, function (r) {
  state.rep = r;
  show();
  draw(true);
});
toggle(footer.querySelectorAll(".anim-view button"), state.view, function (v) {
  state.view = v;
  show();
  draw(false);
});
unit.addEventListener("change", function () { Plotly.relayout(gd, titles()); });

// Play: s sweeps up to its end (from 0 if there already), SWEEP_MS for the
// whole range, t fixed; pause stops it (and so do the dots, the sliders, the
// zoom, a change of law)
function stop() { playing = false; last = null; }
function frame(now) {
  if (!playing) { return; }
  var D = law();
  if (last !== null) {
    state.s = Math.min(Math.min(state.s, D.sMax) + (now - last) / SWEEP_MS * D.sMax, D.sMax);
    draw(false);
    if (state.s >= D.sMax) { stop(); return; }
  }
  last = now;
  requestAnimationFrame(frame);
}
function play() {
  if (playing) { return; }
  var D = law();
  if (state.s >= D.sMax - 1e-9) { state.s = 0; draw(false); }
  playing = true;
  last = null;
  requestAnimationFrame(frame);
}
footer.querySelector(".anim-play").addEventListener("click", play);
footer.querySelector(".anim-pause").addEventListener("click", stop);
// Space plays or pauses (not when a list or button has the focus: it acts on
// it)
document.addEventListener("keydown", function (e) {
  var tag = (e.target.tagName || "").toLowerCase();
  if (e.code !== "Space" || tag === "select" || tag === "button" || tag === "input") {
    return;
  }
  e.preventDefault();
  (playing ? stop : play)();
});

// Start: the law of the URL hash (#exp, #weibull), the layout
start();
