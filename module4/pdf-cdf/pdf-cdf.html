// Draggable dots on an axis (a track): spec {name, label, n (dots), vertical,

// Place the dots of a track at vals, the bar from bar[0] to bar[1] (null: no

    var t = (v - range[0]) / (range[1] - range[0]);

// Layouts: sizes, panels and titles (relayout), the header, footer and tracks

var TRACKS = [{"name": "pdf", "kind": "x", "label": "End of the interval, x axis of the PDF", "n": 2, "vertical": false, "step": 0.01, "digits": 2}, {"name": "cdf", "kind": "x", "label": "End of the interval, x axis of the CDF", "n": 2, "vertical": false, "step": 0.01, "digits": 2}, {"name": "p", "kind": "p", "label": "End of the interval, p axis of the CDF", "n": 2, "vertical": true, "step": 0.001, "digits": 3}], READOUT = "<span><i>P</i>(%x1 &lt; <i>X</i> ≤ %x2) = <i>F</i><sub><i>X</i></sub>(%x2) − <i>F</i><sub><i>X</i></sub>(%x1)</span><span>≈ %p2 − %p1 ≈ <b>%P</b></span>", READOUT_CDF = "<span><i>P</i>(<i>X</i> ≤ %x2) = <i>F</i><sub><i>X</i></sub>(%x2)</span><span>≈ <b>%P</b></span>";

// Interpolation in a table t (nodes z, f, F; a double node at a finite end

// known at the nodes); f: linear.
function search(xs, v) {

  var k = search(t.z, v), n = t.z.length;

// The law of the selection: its table mapped by X = loc + scale Z
function law() {

  var lin = function (c) {
    return Object.keys(c).reduce(function (s, k) { return s + c[k] * v[k]; }, 0);

// Curves of the law: the nodes of its table, mapped, and a point past each
// end of the full x axis (any zoom); the CDF on the support (z within it) and outside it

function curves(D) {
  var t = LAWS[state.dist].table, n = t.z.length, s0 = t.support[0], s1 = t.support[1];

// Draw the selection: the curves (full: after a change of law or parameter),

// (state.kind, the axis used last), clamped to the axes.

    ps = xs.map(D.F);

    ps = state.vals.map(clamp(D.F(D.lo), D.F(D.hi)));

  var x = [area.x, edges.x, guides.x, arc.x];

// Handles: on each track, two dots (value i of the interval, on every track)
// and the bar between them; for the CDF, the dot of the end kept and the bar
// from the start of the axis (x) or from 0 (p)

  tracks.forEach(function (tr) {
    var x = tr.name !== "p", vals = x ? cur.xs : cur.ps;
    var bar = state.cdf ? [x ? D.lo : 0, vals[state.end]] : vals;
    placeTrack(tr, vals, bar, state.cdf ? [state.end === 0, state.end === 1] : null);

// Set value i of the interval on an axis (kind x or p), snapped; the other
// value follows on that axis
function set(kind, i, v) {
  if (state.kind !== kind) {
    state.vals = (kind === "x" ? cur.xs : cur.ps).slice();
    state.kind = kind;
  }
  var D = law();
  v = Math.round(v / STEPS[kind]) * STEPS[kind];
  state.vals[i] = kind === "x" ? clamp(D.lo, D.hi)(v) : clamp(0, 1)(v);

TRACKS.forEach(function (spec) {
  var x = spec.kind === "x";
  makeTrack(spec, {
    range: function () {
      if (!x) { return PR; }
      var D = law();
      return [D.lo, D.hi];

    values: function () { return x ? cur.xs : cur.ps; },
    set: function (i, v) { set(spec.kind, i, v); },
    pick: function () { return state.cdf ? state.end : null; }
  });

  state.end = 1;

toggle(footer.querySelectorAll(".anim-range button"), state.cdf, function (c) {
  state.cdf = c;
  if (c) { state.end = cur.xs[0] <= cur.xs[1] ? 1 : 0; }
  draw(false);
});

start();
