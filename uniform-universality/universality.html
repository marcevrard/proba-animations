// Layout of a direction: ticks, panel and axis titles (in the current unit),
// subtitle
function dirLayout(d) {
  var layout = Object.assign({}, DIRS[d].ticks);
  Object.keys(DIRS[d].titles).forEach(function (k) {
    layout[k] = DIRS[d].titles[k].split("__UNIT__").join(unit.value);
  });
  layout["title.subtitle.text"] = DIRS[d].subtitle;
  return layout;
}

function toggle(buttons, value, onchange) {
  buttons.forEach(function (btn) {
    btn.setAttribute("aria-pressed", btn.value === value);
    btn.addEventListener("click", function () {
      if (switching || btn.getAttribute("aria-pressed") === "true") { return; }
      buttons.forEach(function (b) { b.setAttribute("aria-pressed", b === btn); });
      onchange(btn.value);
    });
  });
}
toggle(panel.querySelectorAll(".anim-toggle button"), state.mode, function (m) {
  state.mode = m;
  select();
});

// Direction: everything of the other direction at once (start, hash) or,
// when switching, morph the curve (mirrored across the diagonal), the two
// densities (they swap panels) and the rug, then set the rest
function applyDir() {
  var k = key();
  var layout = Object.assign(dirLayout(state.dir), sliders(k));
  steps.innerHTML = DIRS[state.dir].steps;
  return Plotly.update(gd, MORPH[state.dir], {}, [4, 2, 6])
    .then(function () { return reshuffle(k); })
    .then(function () { return update(k, layout); });
}
function lerp(a, b, t) {
  return a.map(function (v, j) { return v + (b[j] - v) * t; });
}
function switchDir(d) {
  switching = true;
  var fromDir = state.dir, from = key();
  state.dir = d;
  var k = key();
  if (history.replaceState) { history.replaceState(null, "", "#" + DIRS[d].hash); }
  // Keyframes: the curve and the rug slide (eased), the densities go through
  // the shapes from bell to box: the target (left) becomes f_U in direction
  // "c", the source (bottom) f_X, and back
  var last = START[k].x.length - 1;
  var rug0 = START[from].x[last], rug1 = START[k].x[last], rugY = START[k].y[last];
  var c0 = MORPH[fromDir], c1 = MORPH[d], K = SHAPES.taus.length - 1;
  var frames = [];
  for (var i = 1; i <= K; i++) {
    var t = SHAPES.taus[i];
    var toBox = SHAPES.shapes[i], toBell = SHAPES.shapes[K - i];
    var left = d === "c" ? toBox : toBell, bottom = d === "c" ? toBell : toBox;
    frames.push({traces: [4, 2, 6, 7], data: [
      {x: lerp(c0.x[0], c1.x[0], t), y: lerp(c0.y[0], c1.y[0], t)},
      {x: left, y: SHAPES.s},
      {x: SHAPES.s, y: bottom},
      {x: lerp(rug0, rug1, t), y: rugY}
    ]});
  }
  var step = 1200 / K;
  return stop()
    .then(function () { return Plotly.restyle(gd, {visible: false}, ANIMATED); })
    .then(function () { return Plotly.restyle(gd, {visible: true}, [DIAG]); })
    .then(function () {
      return Plotly.animate(gd, frames, {
        mode: "immediate",
        frame: {duration: step, redraw: false},
        transition: {duration: step, easing: "linear"}
      });
    })
    .then(applyDir)
    .then(function () { return Plotly.restyle(gd, {visible: true}, ANIMATED); })
    .then(function () { return Plotly.restyle(gd, {visible: false}, [DIAG]); })
    .then(function () { switching = false; }, function () { switching = false; });
}
toggle(header.querySelectorAll(".anim-toggle button"), state.dir, switchDir);

// Start: build the frames of every selection, then show the direction of the
// URL hash (#quantile or #cdf; the controls wait until then)
Promise.all(KEYS.map(fresh)).then(function () {
  Object.keys(DIRS).forEach(function (d) {
    if (location.hash === "#" + DIRS[d].hash) {
      state.dir = d;
      header.querySelectorAll(".anim-toggle button").forEach(function (b) {
        b.setAttribute("aria-pressed", b.value === d);
      });
    }
  });
  return applyDir();
}).then(function () { switching = false; }, function () { switching = false; });

// Space plays or pauses (not when a control has the focus: it acts on it)
document.addEventListener("keydown", function (e) {
  var tag = (e.target.tagName || "").toLowerCase();
  if (e.code !== "Space" || tag === "select" || tag === "button") { return; }
  e.preventDefault();
  (playing ? actions.pause : actions.play)();
});

// Fit to the window: the plot and its controls scale as one box (CSS
// transform; the plot is vector, sharp at any scale and pixel density), up
// to 1.5 times their size, centred, with a small margin
var W = 688, H = 902, PAD = 8, box = gd.parentNode;
document.body.style.margin = "0";
box.style.overflow = "hidden";
box.style.margin = PAD + "px auto";
gd.style.width = W + "px";
gd.style.height = H + "px";
gd.style.transformOrigin = "0 0";
function fit() {
  var s = Math.min((window.innerWidth - 2 * PAD) / W,
                   (window.innerHeight - 2 * PAD) / H, 1.5);
  gd.style.transform = "scale(" + s + ")";
  box.style.width = W * s + "px";
  box.style.height = H * s + "px";
}
window.addEventListener("resize", fit);
fit();
