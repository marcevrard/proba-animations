// Draw: the code base at phase (0: Alice searching, 1: Bob searching, 2:

  }

  var shownB = phase === 0 ? 0 : phase === 1 ? Math.floor(camp.bob.length * acc) : camp.bob.length;

function drawView() {

  for (var k = 0; k <= s.n; k++) { ks.push(k); }
  var probs = state.easy ? sim : hg, layout = {};
  var top = 0;
  if (state.view === 0) {
    var lo = s.n, hi = 0;
    ks.forEach(function (k) {
      if (Math.max(hg[k], bi[k], state.easy ? sim[k] : 0) > 1e-4) { lo = Math.min(lo, k); hi = Math.max(hi, k); }
      top = Math.max(top, hg[k], bi[k], state.easy ? sim[k] : 0);
    });
    var kObs = phase === 2 ? [camp.k, camp.k] : [], yObs = phase === 2 ? [0, top * 1.08] : [];
    Plotly.restyle(gd, {
      x: [ks, ks, state.easy ? ks : [], kObs],
      y: [hg, bi, state.easy ? sim : [], yObs]
    }, [TR.hgeom, TR.binom, TR.sim, TR.observed]);
    layout["xaxis2.range"] = [lo - 0.6, hi + 0.6];
    layout["xaxis2.dtick"] = niceStep(hi - lo + 1);
  } else {
    var x = [], y = [];
    for (k = 1; k <= s.n; k++) {
      if (probs[k] > 1e-5) { x.push(s.m * s.n / k); y.push(probs[k]); top = Math.max(top, probs[k]); }
    }
    Plotly.restyle(gd, {x: [x, [s.N, s.N]], y: [y, [0, top * 1.08]]}, [TR.est, TR.truth]);
    layout["xaxis2.range"] = [0, 3 * s.N];
    layout["xaxis2.dtick"] = niceStep(3 * s.N);
  }
  var yTop = Math.max(0.1, Math.ceil(top * 1.15 / 0.05) * 0.05);
  layout["yaxis2.range"] = [0, yTop];
  layout["yaxis2.dtick"] = niceStep(yTop * 10) / 10;
  Plotly.relayout(gd, layout);
}
function niceStep(span) {
  var raw = span / 6, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p;
}
// The lines: the campaign and its estimate; the view's figures
function stats() {
  var s = camp.s, k = camp.k, hg = hgeom(s), bi = binom(s);
  var est = k ? s.m * s.n / k : null, found = s.m + s.n - k;
  var line1 = "Alice: <b>" + group(s.m) + "</b>, Bob: <b>" + group(s.n) + "</b>, both: <b>" +
    group(k) + "</b> → " + (k ? "<i>N</i>̂ = " + group(s.m) + "·" + group(s.n) + "/" + group(k) +
    " = <b>" + num(est, 1) + "</b> bugs (true: " + group(s.N) + "); still hidden: about " +
    num(Math.max(est - found, 0), 1) + " (true: " + group(s.N - found) + ")" :
    "no bug in common, no estimate");
  var line2;
  if (state.view === 0) {
    var tv = 0;
    hg.forEach(function (v, i) { tv += Math.abs(v - bi[i]); });
    line2 = "Mean of <i>K</i>: <i>nm</i>/<i>N</i> = " + fmt(s.n * s.m / s.N, 2) +
      " for both; variance ratio HGeom/Bin = (<i>N</i> − <i>n</i>)/(<i>N</i> − 1) = " +
      fmt(s.N > 1 ? (s.N - s.n) / (s.N - 1) : 0, 3) +
      '; distance between the laws: <b class="anim-ref">' + fmt(tv / 2, 3) + "</b>";
  } else {
    var probs = state.easy ? sim : hg, cum = 0, med = null;
    for (var j = s.n; j >= 1; j--) {
      cum += probs[j];
      if (med === null && cum >= 0.5) { med = s.m * s.n / j; }
    }
    line2 = (state.easy ? "Simulated (" + group(M_SIM) + " campaigns): " : "Exact: ") +
      "<i>P</i>(<i>K</i> = 0) = " + fmt(probs[0], 3) + ", no estimate; median of <i>N</i>̂: " +
      '<b class="anim-ref">' + (med === null ? "–" : num(med, 1)) + "</b> (true: " + group(s.N) + ")";
  }
  readout.innerHTML = "<span>" + line1 + "</span><span>" + line2 + "</span>";
}
// After a change: a new campaign, shown done (and the simulation of easy and
// hard bugs)
function redraw() {
  stop();
  var s = setting();
  camp = campaign(s);
  sim = state.easy ? simulate(s) : null;
  phase = 2;
  draw();
}

// N (log scale) and Bob's finds n: sliders of the header row
function own(label, min, max, value, onInput) {
  var el = document.createElement("label"), input = document.createElement("input"),
    out = document.createElement("output");
  el.className = "anim-own";
  el.innerHTML = label;
  input.type = "range";
  input.min = min;
  input.max = max;
  input.step = 1;
  input.value = value;
  el.appendChild(input);
  el.appendChild(out);
  header.querySelector(".anim-row").appendChild(el);
  input.addEventListener("input", function () { onInput(Number(input.value)); });
  return {input: input, out: out};
}
var nSlider = own("Bugs <i>N</i>", 0, N_VALUES.length - 1, state.ni, function (v) {
  state.ni = v;
  showOwn();
  redraw();
});
var bobSlider = own("Bob finds <i>n</i>", 1, N_BOB_MAX, state.n, function (v) {
  state.n = v;

  redraw();
});

  nSlider.out.innerHTML = group(N_VALUES[state.ni]);

}
header.querySelector(".anim-reset").addEventListener("click", function () {

// Footer: a new campaign; the difficulty, the hidden bugs, the view
footer.querySelector(".anim-new").addEventListener("click", function () {

var noteEl = footer.querySelector(".anim-note");
toggle(footer.querySelectorAll(".anim-easy button"), state.easy, function (v) {

toggle(footer.querySelectorAll(".anim-reveal button"), state.reveal, function (v) {

// View of the right panel (state.view: 0, overlap; 1, estimate): its traces
// (META: the view of each, null for both panels) and titles
function show() {
  var vis = META.map(function (v) { return v === null || v === state.view; });
  Plotly.restyle(gd, {visible: vis}, META.map(function (v, i) { return i; }));
  Plotly.relayout(gd, VIEWS[state.view]);
}
toggle(footer.querySelectorAll(".anim-view button"), state.view, function (v) {
  state.view = v;
  show();
  draw();
});

// Play: a new campaign, Alice's search then Bob's (SEARCH_MS each); pause
// shows it done
function stop() {
  if (playing || phase < 2) { phase = 2; playing = false; last = null; if (camp) { draw(); } }
}
function frame(now) {
  if (!playing) { return; }
  if (last !== null) {
    acc += (now - last) / SEARCH_MS;
    if (acc >= 1) { acc = 0; phase++; }
    draw();
    if (phase >= 2) { playing = false; last = null; return; }
  }
  last = now;
  requestAnimationFrame(frame);
}
function play() {
  if (playing) { return; }
  camp = campaign(setting());
  phase = 0;
  acc = 0;
  playing = true;
  last = null;
  draw();
  requestAnimationFrame(frame);
}
footer.querySelector(".anim-play").addEventListener("click", play);
footer.querySelector(".anim-pause").addEventListener("click", stop);
// Space plays or pauses (not when a list or button has the focus: it acts on
// it)
document.addEventListener("keydown", function (e) {
  var tag = (e.target.tagName || "").toLowerCase();
  if (e.code !== "Space" || tag === "select" || tag === "button" || tag === "input") {
    return;
  }
  e.preventDefault();
  (playing ? stop : play)();
});

// Start: the generator, the sliders' values, the layout
random = generator();
noteEl.hidden = !state.easy;
showOwn();
start();
