    [cell(t.tp), cell(t.fn), cell(t.sick, true)]
  ];
  // Curve: P(D | T) and P(not D | not T) against the prior, the tests' dots
  var cx = [], cp = [], cn = [];
  for (var k = 0; k <= 200; k++) {
    var q = Math.pow(10, PRIOR_RANGE[0] + (PRIOR_RANGE[1] - PRIOR_RANGE[0]) * k / 200);
    cx.push(q); cp.push(ppv(q, v)); cn.push(npv(q, v));
  }
  var dots = {x: [v.p], y: [ppv(v.p, v)]};
  if (stage === 2) { dots.x.push(prior); dots.y.push(ppv(prior, v)); }
  Plotly.update(gd, {
    text: [text, undefined, undefined, undefined],
    x: [undefined, cx, cx, dots.x],
    y: [undefined, cp, cn, dots.y]
  }, layout, [TR.matrix, TR.ppv, TR.npv, TR.dots]);
  // Lines
  var exactP = ppv(prior, v), exactN = npv(prior, v);
  var parts = {
    "$stage": stage === 1 ? "Positive test" : "Two positive tests",
    "$pdt": NOTATION.pdt[stage - 1], "$pnn": NOTATION.pnn[stage - 1],
    "$neglabel": NOTATION.neglabel[stage - 1],
    "$tp": count(t.tp), "$pos": count(pos), "$sick": count(t.sick),
    "$tn": count(t.tn), "$neg": count(neg),
    "$ppv": pos ? pct(t.tp / pos, 1) : "–", "$sens": t.sick ? pct(t.tp / t.sick, 1) : "–",
    "$npv": neg ? pct(t.tn / neg, 2) : "–",
    "$exactppv": state.mode ? " (exact: " + pct(exactP, 1) + ")" : "",
    "$exactnpv": state.mode ? " (exact: " + pct(exactN, 2) + ")" : ""
  };
  var s = READOUT;
  Object.keys(parts).forEach(function (k) { s = s.split(k).join(parts[k]); });
  readout.innerHTML = s;
  retest.textContent = stage === 1 ? "Retest the positives" : "Back to test 1";
}
// After a change of parameter, population or mode: test 1, new counts
function redraw() {
  stage = 1;
  sample = tests();
  draw();
}
function placeAll() {}
function selectLaw(d) { showLaw(d); show(); redraw(); }

// Population size: a list in the header row
var popLabel = document.createElement("label"), popList = document.createElement("select");
popLabel.className = "anim-pop";
popLabel.innerHTML = "Population";
popList.className = "anim-select";
popList.innerHTML = POPULATIONS.map(function (n) {
  return '<option value="' + n + '">' + count(n) + "</option>";
}).join("");
popList.value = String(state.pop);
popLabel.appendChild(popList);
header.querySelector(".anim-row").appendChild(popLabel);
popList.addEventListener("change", function () { state.pop = Number(popList.value); redraw(); });

// Footer: counts (expected or sample), a new sample, the retest, the view
var newSample = footer.querySelector(".anim-new"), retest = footer.querySelector(".anim-retest");
function modeButtons() { newSample.disabled = !state.mode; }
toggle(footer.querySelectorAll(".anim-mode button"), state.mode, function (m) {
  state.mode = m;
  modeButtons();
  redraw();
});
newSample.addEventListener("click", function () { if (state.mode) { redraw(); } });
retest.addEventListener("click", function () { stage = 3 - stage; draw(); });
// View of the right panel (state.view: 0, matrix; 1, curve): its traces
// (META: the view of each, null for both panels), titles and axes
function show() {
  var vis = META.map(function (v) { return v === null || v === state.view; });
  Plotly.restyle(gd, {visible: vis}, META.map(function (v, i) { return i; }));
  Plotly.relayout(gd, VIEWS[state.view]);
}
toggle(footer.querySelectorAll(".anim-view button"), state.view, function (v) {
  state.view = v;
  show();
  draw();
});

// Start: the generator, the layout
random = generator();
modeButtons();
start();
