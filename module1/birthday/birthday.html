// Draggable dots on an axis (a track): spec {name, label, n (dots), vertical,
// step (snap and arrow keys; Shift: ten), digits, tags (labels shown, or

// set(i, v): dot i moved to v, pick(v, values): the dot a press at v grabs
// (null: the nearer)}

  el.appendChild(bar);
  for (var j = 0; j < spec.n; j++) {

        if (!d) { return; }

    t = clamp(0, 1)(t);

    drag = hooks.pick ? hooks.pick(v, vals) : null;
    if (drag === null) {

      vals.forEach(function (w, i) {
        if (Math.abs(v - w) < Math.abs(v - vals[drag])) { drag = i; }

    hooks.set(drag, v);

// Place the dots of a track at vals, the bar from bar[0] to bar[1] (null: no

function placeTrack(tr, vals, bar, shown) {
  var g = LAYOUTS[state.layout].tracks[tr.name], range = tr.hooks.range();
  var pos = function (v) {
    var t = (v - range[0]) / (range[1] - range[0]);
    return TRACK_PAD + (g.vertical ? 1 - t : t) * g.len;
  };
  tr.dots.forEach(function (dot, i) {
    dot.style[g.vertical ? "top" : "left"] = pos(vals[i]) + "px";
    dot.style.display = shown && !shown[i] ? "none" : "";

  tr.bar.style[g.vertical ? "top" : "left"] = Math.min(a, b) + "px";
  tr.bar.style[g.vertical ? "height" : "width"] = Math.abs(b - a) + "px";
}

// Layouts: sizes, panels and titles (relayout), the header, footer and tracks
function applyLayout(name) {

  gd.style.width = L.width + "px";
  gd.style.height = L.height + "px";

// Fit to the window: the layout that shows larger (the first if equal), as

box.style.overflow = "hidden";
box.style.margin = PAD + "px auto";

function fit() {
  var best = null, s = 0;
  Object.keys(LAYOUTS).forEach(function (name) {
    var L = LAYOUTS[name];
    var k = Math.min((window.innerWidth - 2 * PAD) / L.width,
                     (window.innerHeight - 2 * PAD) / L.height, 1.5);
    if (best === null || k > s) { best = name; s = k; }
  });
  var done = best !== state.layout ? applyLayout(best) : Promise.resolve();
  gd.style.transform = "scale(" + s + ")";
  box.style.width = LAYOUTS[best].width * s + "px";

// Start (called at the end of the page script): the law of the URL hash, the

var LAW = "bday", TR = {"calendar": 0, "me": 1, "half": 2, "mine": 3, "exact": 4, "sim": 5, "guide": 6}, DAYS = 365, LENGTHS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"], N_MAX = 70, M = 10000, STEP_MS = 400;
var SEED = null, READOUT = "<span><b>$n</b> $people, <b>$pairs</b> $pairword: <i>P</i>(<i>A</i>) = <b>$pa</b> (simulated: $sim% of $M classes); someone shares my birthday: <b class=\"anim-ref\">$mine</b></span><span>This class: $shared; my birthday (ringed), $me</span>", LEFT_TITLE = "This class: %n";
var N_RANGE = [-6.363636363636363, 70], TRACK = {"name": "n", "label": "Number of people n", "n": 1, "vertical": false, "step": 1, "digits": 0, "tags": ["n"]};
var cls = null, share = null, playing = false, last = null, acc = 0;
// Month and day (0-based) of each day of the year
var DATE = [];
LENGTHS.forEach(function (len, m) { for (var j = 0; j < len; j++) { DATE.push([m, j]); } });

// Random numbers: Math.random, or a generator seeded with SEED (mulberry32),
// restarted at each draw so that every draw is the same
function generator() {
  if (SEED === null) { return Math.random; }
  var a = SEED >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    var t = Math.imul(a ^ (a >>> 15), a | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

// The class shown (the birthdays of persons 1 to N_MAX), and M simulated
// classes: for each, the first person whose birthday is already taken
// (N_MAX + 1: none); share[n], the share of them with a shared day by n
function draw_classes() {
  var random = generator(), day = function () { return Math.floor(random() * DAYS); };
  cls = [];
  for (var i = 0; i < N_MAX; i++) { cls.push(day()); }
  var stamp = new Int32Array(DAYS), first = new Int32Array(N_MAX + 2);
  for (var c = 1; c <= M; c++) {
    var k = N_MAX + 1;
    for (i = 1; i <= N_MAX; i++) {
      var d = day();
      if (stamp[d] === c) { k = i; break; }
      stamp[d] = c;
    }
    first[k]++;

  for (var n = 1; n <= N_MAX; n++) { share.push(share[n - 1] + first[n] / M); }
}
// P(A) and P(someone shares my birthday) for n people
function pA(n) {
  var q = 1;
  for (var i = 0; i < n; i++) { q *= (DAYS - i) / DAYS; }
  return 1 - q;
}
function pMine(n) { return n < 1 ? 0 : 1 - Math.pow((DAYS - 1) / DAYS, n - 1); }

// The curves (after a new draw): P(A), the simulated shares, P(someone
// shares my birthday)
function drawCurves() {
  var x = [], a = [], mine = [];
  for (var n = 0; n <= N_MAX; n++) { x.push(n); a.push(pA(n)); mine.push(pMine(n)); }
  Plotly.restyle(gd, {x: [x, x.slice(1), x], y: [a, share.slice(1), mine]},
    [TR.exact, TR.sim, TR.mine]);
}
// The class of the first state.n people: the calendar (0, nobody; 1, one
// person; 2, a shared day; blank, impossible dates), my birthday ringed, the
// dot of n on P(A) and its guide, the lines of the class
function draw() {
  var n = state.n, count = new Int32Array(DAYS), z = [];
  for (var i = 0; i < n; i++) { count[cls[i]]++; }
  for (var m = 0; m < 12; m++) {
    var row = [];
    for (var j = 0; j < 31; j++) { row.push(j < LENGTHS[m] ? 0 : null); }
    z.push(row);
  }
  var shared = [];
  for (var d = 0; d < DAYS; d++) {
    var c = count[d];
    z[DATE[d][0]][DATE[d][1]] = c === 0 ? 0 : c === 1 ? 1 : 2;
    if (c > 1) { shared.push([d, c]); }

  var me = cls[0], p = pA(n);
  Plotly.update(gd, {
    z: [z, undefined, undefined],
    x: [undefined, [DATE[me][1] + 1], [n, n]],
    y: [undefined, [DATE[me][0]], [0, p]]
  }, {"annotations[0].text": LEFT_TITLE.replace("%n", n + (n === 1 ? " person" : " people"))},
  [TR.calendar, TR.me, TR.guide]);

  var sharedText = shared.length === 0 ? "no shared day" :
    (shared.length === 1 ? "1 shared day" : shared.length + " shared days") + " (" +
    shared.slice(0, 3).map(function (s) { return label(s[0]) + ", " + s[1]; }).join("; ") +
    (shared.length > 3 ? "; …" : "") + ")";

  var parts = {
    "$n": String(n), "$people": n === 1 ? "person" : "people",
    "$pairs": String(n * (n - 1) / 2), "$pairword": n === 2 ? "pair" : "pairs", "$pa": fmt(p, 3),
    "$sim": fmt(100 * share[n], 1), "$M": String(M).replace(/\B(?=(\d{3})+(?!\d))/g, ","),
    "$mine": fmt(pMine(n), 3), "$shared": sharedText,
    "$me": label(me) + (n < 2 ? "" : mineShared ? ", shared" : ", not shared")
  };

  Object.keys(parts).forEach(function (k) { text = text.split(k).join(parts[k]); });

}

// The dot of n, on the x axis of the right panel (a bar from 0)
function placeAll() {
  if (cls === null) { return; }
  placeTrack(tracks[0], [state.n], [0, state.n], [true]);
}
makeTrack(TRACK, {
  range: function () { return N_RANGE; },
  values: function () { return [state.n]; },
  set: function (i, v) {

    state.n = clamp(1, N_MAX)(Math.round(v));

footer.querySelector(".anim-new").addEventListener("click", function () {

  draw_classes();

// Play: one more person every STEP_MS, up to N_MAX (from 1 if there already);
// pause stops it (and so do the dot and a new class)
function stop() { playing = false; last = null; }
function frame(now) {
  if (!playing) { return; }
  if (last !== null) {
    acc += now - last;
    if (acc >= STEP_MS) {
      acc -= STEP_MS;
      state.n += 1;
      draw();
      if (state.n >= N_MAX) { stop(); return; }
    }
  }
  last = now;
  requestAnimationFrame(frame);
}

  if (playing) { return; }
  if (state.n >= N_MAX) { state.n = 1; draw(); }
  playing = true;
  last = null;
  acc = 0;
  requestAnimationFrame(frame);
}
footer.querySelector(".anim-play").addEventListener("click", play);
footer.querySelector(".anim-pause").addEventListener("click", stop);
// Space plays or pauses (not when a list or button has the focus: it acts on
// it)
document.addEventListener("keydown", function (e) {
  var tag = (e.target.tagName || "").toLowerCase();
  if (e.code !== "Space" || tag === "select" || tag === "button" || tag === "input") {
    return;
  }
  e.preventDefault();
  (playing ? stop : play)();
});

// Start: the classes, the layout
draw_classes();
start();
